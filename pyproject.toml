[project]
name = "jobpipe"
version = "0.1.0"
description = "Personal job-application pipeline: ingest, score, review, track."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.40"]
browser = ["playwright>=1.40"]

[project.scripts]
jobpipe = "jobpipe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
