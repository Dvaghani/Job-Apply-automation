<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}jobpipe{% endblock %}</title>
<style>
  :root {
    --bg: #fbfaf8; --fg: #1a1a1a; --muted: #6b6b6b;
    --line: #e3e0da; --card: #fff; --accent: #c2410c;
    --good: #15803d; --mid: #a16207; --low: #9ca3af;
    --term-bg: #1e1e23; --term-fg: #e4e2dd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --fg: #ecebe8; --muted: #9a9a96;
      --line: #2e2e34; --card: #1e1e23; --accent: #fb923c;
      --good: #4ade80; --mid: #fbbf24; --low: #6b7280;
      --term-bg: #101014; --term-fg: #e4e2dd;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
       color: var(--muted); margin: 32px 0 12px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
  nav a { padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px;
          text-decoration: none; color: var(--muted); font-size: 13px; }
  nav a.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  button { font: inherit; font-size: 13px; padding: 5px 14px; cursor: pointer;
           border: 1px solid var(--line); border-radius: 6px;
           background: var(--card); color: var(--fg); }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.yes { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; }
  .empty { color: var(--muted); padding: 48px 0; text-align: center; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<div class="wrap">
  <h1>{% block heading %}jobpipe{% endblock %}</h1>
  <div class="sub">{% block subtitle %}{% endblock %}</div>

  <nav>
    <a href="{{ url_for('dashboard') }}" class="{{ 'on' if page == 'dashboard' }}">Dashboard</a>
    <a href="{{ url_for('review') }}" class="{{ 'on' if page == 'review' }}">Review queue</a>
    <a href="{{ url_for('settings') }}" class="{{ 'on' if page == 'settings' }}">Settings</a>
    {% block nav_extra %}{% endblock %}
  </nav>

  {% block content %}{% endblock %}
</div>
{% block script %}{% endblock %}
</body>
</html>
