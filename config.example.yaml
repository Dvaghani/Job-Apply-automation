# Copy to config.yaml and edit. config.yaml is gitignored — it's yours.

# How scoring and tailoring reach Claude.
#   claude-cli  runs on a Claude Pro/Max subscription via the Claude Code CLI
#   api         needs ANTHROPIC_API_KEY and separate API credits
# Claude Pro does NOT include API access — if Pro is what you have, use claude-cli.
backend: claude-cli
cli_model: sonnet        # CLI aliases: opus / sonnet / haiku
cli_timeout: 300

sources:
  # Greenhouse board tokens. Find one in a company's board URL:
  #   https://boards.greenhouse.io/<token>  ->  the token
  # Or https://job-boards.greenhouse.io/<token>
  greenhouse:
    - stripe
    - figma

  # Lever site slugs, from https://jobs.lever.co/<slug>
  lever:
    - leverdemo   # replace with real slugs — companies move ATS often

  # Ashby org slugs, from https://jobs.ashbyhq.com/<slug>
  ashby:
    - linear
    - ramp

  # SmartRecruiters company slugs, from careers.smartrecruiters.com/<slug>.
  # Best European coverage of the free ATS feeds.
  smartrecruiters:
    - ContinentalAG

  # --- If you are job-hunting in Germany, start here --------------------
  # The ATS feeds above are US-tech-weighted and return almost nothing for
  # German employers. These three cover that market instead.

  # Bundesagentur fuer Arbeit — the federal register. Free, no registration,
  # by far the largest source in Germany, and it links to the employer.
  # A description costs one extra request per job, so keep `queries` to a
  # few broad words and let the fit scorer judge.
  # arbeitsagentur:
  #   where: "Chemnitz"
  #   umkreis: 100            # km
  #   max_days_old: 45
  #   max_pages: 2
  #   max_details: 150        # cap on description fetches per run
  #   exclude_staffing: true  # drops Zeitarbeit and private recruiters —
  #                           # most of the noise in a German tech search
  #   queries:
  #     - "Softwareentwickler"
  #     - "Embedded"

  # Arbeitnow — open, German-focused, descriptions included. A general board,
  # so narrow it or it contributes the noise you came here to avoid.
  # arbeitnow:
  #   max_pages: 2
  #   keywords: [software, engineer, entwickler, embedded, python]
  #   location_contains: [germany, deutschland, remote]

  # GermanTechJobs — small, all IT, usually states a salary. Publishes no
  # location, so a `locations:` filter would reject all of it.
  # germantechjobs:
  #   keywords: [software, engineer, entwickler, embedded, python]

  # Optional broad aggregator. Free key: https://developer.adzuna.com/
  # Leave the whole block out if you only want the watchlist above.
  # adzuna:
  #   app_id: your_app_id       # or set ADZUNA_APP_ID
  #   app_key: your_app_key     # or set ADZUNA_APP_KEY
  #   country: us
  #   where: "San Francisco"
  #   distance: 50              # km radius — without this the radius is tight
  #   max_days_old: 30
  #   max_pages: 2
  #   queries:                  # each word in a query must match, so keep
  #     - "python"              # them SHORT. Long phrases return nothing.
  #     - "backend engineer"

# Deterministic rules applied before any LLM call. Each one is optional;
# omit a key to skip that check. These are free — use them aggressively.
filters:
  # remote_only: true
  # locations: ["san francisco", "new york", "remote"]
  # min_salary: 150000        # only checked when the posting states a salary
  # max_age_days: 30
  title_exclude:
    - intern
    - internship
    - "vice president"
    - director
  # title_include: ["engineer", "developer"]

# Claude model used for scoring. Opus gives the best calibration; switch to
# claude-sonnet-5 or claude-haiku-4-5 if you're scoring hundreds a day and
# want to cut cost.
model: claude-opus-5

# Jobs scoring below this never appear in the review queue.
# Output language for tailoring: en | de.
# German needs a German master resume. By convention that is resume.de.json
# next to resume.json, or point at it explicitly:
#   resume_paths:
#     de: resume.de.json
language: en

min_score: 60

db_path: jobs.db
profile_path: profile.md

# Master resume (JSON Resume format) and where tailored output is written.
resume_path: resume.json
applicant_path: applicant.yaml
output_dir: applications
